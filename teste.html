<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciamento de Pessoas</title>
    <!-- Carrega Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Configuração do Tema Tailwind -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        'primary': '#4f46e5',
                        'primary-light': '#6366f1',
                        'secondary': '#f97316',
                    }
                }
            }
        }
    </script>
    <style>
        /* Estilos globais para a fonte */
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
    </style>
</head>
<body class="min-h-screen p-4 sm:p-8">
    <div id="app" class="max-w-7xl mx-auto">
        
        <!-- Cabeçalho -->
        <header class="mb-8 p-4 bg-white shadow-lg rounded-xl">
            <h1 class="text-3xl font-extrabold text-gray-800 tracking-tight">Sistema de Gestão de Colaboradores</h1>
            <p class="text-gray-500 mt-1">Integração com API Flask em http://127.0.0.1:5000.</p>
        </header>

        <!-- Formulário de Cadastro -->
        <div class="bg-white p-6 shadow-lg rounded-xl mb-8">
            <h2 class="text-2xl font-semibold mb-4 text-primary">Novo Cadastro</h2>
            <form id="pessoaForm" class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <input type="text" id="nome" placeholder="Nome" required 
                       class="col-span-1 sm:col-span-1 p-3 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary">
                
                <input type="text" id="cargo" placeholder="Cargo" required
                       class="p-3 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary">
                
                <input type="text" id="setor" placeholder="Setor" required
                       class="p-3 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary">
                
                <input type="number" id="salario" placeholder="Salário (R$)" step="0.01" required
                       class="p-3 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary">
                
                <select id="tipo" required
                        class="p-3 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary bg-white">
                    <option value="" disabled selected>Tipo de Contrato</option>
                    <option value="CLT">CLT</option>
                    <option value="PJ">PJ</option>
                </select>

                <button type="submit" 
                        class="col-span-1 sm:col-span-1 p-3 bg-primary hover:bg-primary-light text-white font-bold rounded-lg transition duration-200 shadow-md hover:shadow-lg">
                    Cadastrar Colaborador
                </button>
            </form>
            <div id="messageBox" class="mt-4 p-3 rounded-lg text-sm hidden"></div>
        </div>

        <!-- Lista de Colaboradores -->
        <div class="bg-white p-6 shadow-lg rounded-xl">
            <h2 class="text-2xl font-semibold mb-4 text-primary">Lista de Colaboradores (<span id="totalCount">0</span>)</h2>
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
                            <th class="px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Nome</th>
                            <th class="px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Cargo</th>
                            <th class="px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Setor</th>
                            <th class="px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Salário</th>
                            <th class="px-3 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                            <th class="px-3 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="pessoasTableBody" class="bg-white divide-y divide-gray-200">
                        <!-- Linhas de pessoas serão injetadas aqui -->
                    </tbody>
                </table>
            </div>
        </div>
        
        <!-- Modal de Edição (Inicialmente Oculto) -->
        <div id="editModal" class="fixed inset-0 bg-gray-600 bg-opacity-75 z-50 hidden justify-center items-center">
            <div class="bg-white p-6 rounded-xl shadow-2xl w-full max-w-lg transform transition-all duration-300">
                <h3 class="text-xl font-bold mb-4 text-primary">Editar Colaborador</h3>
                <form id="editForm" class="grid grid-cols-2 gap-4">
                    <input type="hidden" id="edit-id">
                    
                    <label class="col-span-2 block">Nome:
                        <input type="text" id="edit-nome" required class="w-full mt-1 p-2 border rounded-lg">
                    </label>
                    <label class="block">Cargo:
                        <input type="text" id="edit-cargo" required class="w-full mt-1 p-2 border rounded-lg">
                    </label>
                    <label class="block">Setor:
                        <input type="text" id="edit-setor" required class="w-full mt-1 p-2 border rounded-lg">
                    </label>
                    <label class="block">Salário (R$):
                        <input type="number" id="edit-salario" step="0.01" required class="w-full mt-1 p-2 border rounded-lg">
                    </label>
                    <label class="block">Tipo:
                        <select id="edit-tipo" required class="w-full mt-1 p-2 border rounded-lg bg-white">
                            <option value="CLT">CLT</option>
                            <option value="PJ">PJ</option>
                        </select>
                    </label>
                    <label class="col-span-2 flex items-center mt-2">
                        <input type="checkbox" id="edit-ativo" class="h-4 w-4 text-primary rounded border-gray-300">
                        <span class="ml-2 text-gray-700">Ativo</span>
                    </label>

                    <div class="col-span-2 flex justify-end space-x-3 mt-4">
                        <button type="button" onclick="closeEditModal()" 
                                class="px-4 py-2 bg-gray-200 text-gray-800 rounded-lg hover:bg-gray-300 transition duration-150">
                            Cancelar
                        </button>
                        <button type="submit" 
                                class="px-4 py-2 bg-primary text-white rounded-lg hover:bg-primary-light transition duration-150">
                            Salvar Alterações
                        </button>
                    </div>
                </form>
            </div>
        </div>

    </div>

    <script>
        // --- Endereço da API ajustado para o localhost:5000 ---
        const API_BASE_URL = "http://127.0.0.1:5000/pessoas"; 
        const messageBox = document.getElementById('messageBox');

        // --- Funções de Utilidade UI ---

        function showMessage(message, isError = false) {
            messageBox.textContent = message;
            messageBox.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'bg-green-100', 'text-green-700');
            if (isError) {
                messageBox.classList.add('bg-red-100', 'text-red-700');
            } else {
                messageBox.classList.add('bg-green-100', 'text-green-700');
            }
            setTimeout(() => {
                messageBox.classList.add('hidden');
            }, 5000);
        }

        // --- Funções do Modal de Edição ---

        function openEditModal(pessoa) {
            document.getElementById('edit-id').value = pessoa.id;
            document.getElementById('edit-nome').value = pessoa.nome;
            document.getElementById('edit-cargo').value = pessoa.cargo;
            document.getElementById('edit-setor').value = pessoa.setor || ''; 
            document.getElementById('edit-salario').value = pessoa.salario;
            document.getElementById('edit-tipo').value = pessoa.tipo;
            document.getElementById('edit-ativo').checked = pessoa.ativo;
            
            document.getElementById('editModal').style.display = 'flex';
        }

        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
        }

        // --- Funções de Interação com a API (CRUD) ---

        // POST: Criar Pessoa
        document.getElementById('pessoaForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const data = {
                nome: document.getElementById('nome').value,
                cargo: document.getElementById('cargo').value,
                setor: document.getElementById('setor').value,
                salario: parseFloat(document.getElementById('salario').value),
                tipo: document.getElementById('tipo').value,
            };

            try {
                const response = await fetch(API_BASE_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                
                if (response.ok) {
                    showMessage(result.message, false);
                    document.getElementById('pessoaForm').reset();
                    fetchPessoas(); 
                } else {
                    showMessage(`Erro ao cadastrar: ${result.message}`, true);
                }
            } catch (error) {
                console.error('Erro de rede:', error);
                showMessage('Erro de conexão com o servidor. Verifique se o Flask está rodando em http://127.0.0.1:5000.', true);
            }
        });

        // PUT: Atualizar Pessoa
        document.getElementById('editForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const id = document.getElementById('edit-id').value;
            const data = {
                nome: document.getElementById('edit-nome').value,
                cargo: document.getElementById('edit-cargo').value,
                setor: document.getElementById('edit-setor').value,
                salario: parseFloat(document.getElementById('edit-salario').value),
                tipo: document.getElementById('edit-tipo').value,
                ativo: document.getElementById('edit-ativo').checked,
            };

            try {
                const response = await fetch(`${API_BASE_URL}/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                
                if (response.ok) {
                    showMessage(result.message, false);
                    closeEditModal();
                    fetchPessoas();
                } else {
                    showMessage(`Erro ao atualizar: ${result.message}`, true);
                }
            } catch (error) {
                console.error('Erro de rede:', error);
                showMessage('Erro de conexão com o servidor.', true);
            }
        });

        // DELETE: Excluir Pessoa
        window.deletePessoa = async (id) => {
            // NOTE: Substituído alert() por confirm() para fins de teste em navegadores.
            if (!confirm(`Tem certeza que deseja excluir o colaborador ID ${id}?`)) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/${id}`, {
                    method: 'DELETE'
                });

                const result = await response.json();
                
                if (response.ok) {
                    showMessage(result.message, false);
                    fetchPessoas();
                } else {
                    showMessage(`Erro ao excluir: ${result.message}`, true);
                }
            } catch (error) {
                console.error('Erro de rede:', error);
                showMessage('Erro de conexão com o servidor.', true);
            }
        };

        // PATCH: Ativar/Desativar Pessoa
        window.toggleAtivo = async (id, isCurrentlyActive) => {
            const endpoint = isCurrentlyActive ? 'desativar' : 'ativar';
            
            try {
                const response = await fetch(`${API_BASE_URL}/${id}/${endpoint}`, {
                    method: 'PATCH'
                });

                const result = await response.json();
                
                if (response.ok) {
                    showMessage(result.message, false);
                    fetchPessoas();
                } else {
                    showMessage(`Erro ao ${endpoint}: ${result.message}`, true);
                }
            } catch (error) {
                console.error('Erro de rede:', error);
                showMessage('Erro de conexão com o servidor.', true);
            }
        };


        // --- Renderização de Dados ---

        // GET: Obter e Renderizar Pessoas
        async function fetchPessoas() {
            try {
                const response = await fetch(API_BASE_URL);
                const result = await response.json();

                if (response.ok) {
                    renderPessoas(result.pessoas);
                    document.getElementById('totalCount').textContent = result.total;
                } else {
                    showMessage(`Erro ao carregar dados: ${result.message}`, true);
                    renderPessoas([]);
                }
            } catch (error) {
                console.error('Erro de rede:', error);
                showMessage('Erro ao conectar com a API.', true);
                renderPessoas([]);
            }
        }

        function renderPessoas(pessoas) {
            const tbody = document.getElementById('pessoasTableBody');
            tbody.innerHTML = ''; 

            if (pessoas.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="py-4 text-center text-gray-500">Nenhum colaborador cadastrado.</td></tr>';
                return;
            }

            pessoas.forEach(pessoa => {
                const statusClass = pessoa.ativo ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800';
                const statusText = pessoa.ativo ? 'Ativo' : 'Inativo';
                const toggleActionText = pessoa.ativo ? 'Desativar' : 'Ativar';
                const toggleActionClass = pessoa.ativo ? 'bg-yellow-500 hover:bg-yellow-600' : 'bg-green-500 hover:bg-green-600';

                const row = `
                    <tr class="hover:bg-gray-50 transition duration-100">
                        <td class="px-3 py-3 whitespace-nowrap text-sm font-medium text-gray-900">${pessoa.id}</td>
                        <td class="px-3 py-3 whitespace-nowrap text-sm text-gray-700">${pessoa.nome}</td>
                        <td class="px-3 py-3 whitespace-nowrap text-sm text-gray-700">${pessoa.cargo}</td>
                        <td class="px-3 py-3 whitespace-nowrap text-sm text-gray-700">${pessoa.setor || 'N/A'}</td>
                        <td class="px-3 py-3 whitespace-nowrap text-sm text-gray-700">R$ ${pessoa.salario ? pessoa.salario.toFixed(2).replace('.', ',') : '0,00'} (${pessoa.tipo})</td>
                        <td class="px-3 py-3 whitespace-nowrap text-center">
                            <span class="inline-flex items-center px-3 py-1 text-xs font-semibold rounded-full ${statusClass}">
                                ${statusText}
                            </span>
                        </td>
                        <td class="px-3 py-3 whitespace-nowrap text-right text-sm font-medium space-x-2">
                            <button onclick='openEditModal(${JSON.stringify(pessoa)})' class="text-indigo-600 hover:text-indigo-900 bg-indigo-100 px-3 py-1 rounded-full text-xs transition duration-150">
                                Editar
                            </button>
                            <button onclick="toggleAtivo(${pessoa.id}, ${pessoa.ativo})" class="${toggleActionClass} text-white px-3 py-1 rounded-full text-xs transition duration-150">
                                ${toggleActionText}
                            </button>
                            <button onclick="deletePessoa(${pessoa.id})" class="text-red-600 hover:text-red-900 bg-red-100 px-3 py-1 rounded-full text-xs transition duration-150">
                                Excluir
                            </button>
                        </td>
                    </tr>
                `;
                tbody.insertAdjacentHTML('beforeend', row);
            });
        }

        // --- Inicialização ---
        document.addEventListener('DOMContentLoaded', fetchPessoas);

    </script>
</body>
</html>
